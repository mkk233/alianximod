plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// IntelliJ Gradle sync clones compileJava into `_compileJava_1` and resolves
// net.minecraft:client:<ver>:extra as a normal Maven artifact. ForgeGradle
// stores that jar as minecraft_repo/.../client-extra.jar, not in Maven layout.
// Populate bundeled_repo so IDEA can find client-<ver>-extra.jar.
def fgCache = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle')
def extraSrc = new File(fgCache, "minecraft_repo/versions/${minecraft_version}/client-extra.jar")
def bundledDir = new File(fgCache, "bundeled_repo/net/minecraft/client/${minecraft_version}")
def extraDst = new File(bundledDir, "client-${minecraft_version}-extra.jar")
if (extraSrc.exists() && !extraDst.exists()) {
    bundledDir.mkdirs()
    java.nio.file.Files.copy(extraSrc.toPath(), extraDst.toPath())
    def pomSrc = new File(fgCache, "mcp_repo/net/minecraft/client/${minecraft_version}/client-${minecraft_version}.pom")
    def pomDst = new File(bundledDir, "client-${minecraft_version}.pom")
    if (pomSrc.exists() && !pomDst.exists()) {
        java.nio.file.Files.copy(pomSrc.toPath(), pomDst.toPath())
    }
    println "Populated ForgeGradle bundeled_repo for net.minecraft:client:${minecraft_version}:extra"
}

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id

            // 只给 runClient。普通 jar 不读这个目录，也不把授权素材放进 SourceSet。
            def devAnimationDirectory = project.findProperty('xuexiDevEpicFightAnimations')
            if (devAnimationDirectory != null && !devAnimationDirectory.toString().trim().isEmpty()) {
                property 'xueximod.devEpicFightAnimations', devAnimationDirectory.toString().trim()
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // Fallback for IntelliJ `_compileJava_1`: resolve client extra jar from FG cache
    ivy {
        name = 'ForgeGradleMinecraftExtra'
        url = uri("${gradle.gradleUserHomeDir}/caches/forge_gradle/minecraft_repo/versions")
        patternLayout {
            artifact '[revision]/[artifact]-[classifier].[ext]'
        }
        metadataSources { artifact() }
        content { includeModule 'net.minecraft', 'client' }
    }

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }

    // Jade 11.13.3 的正式包。只给开发客户端重映射，不要再把同名 jar 放进 run/mods。
    // 不用 exclusiveContent：重映射后的构件仍是 maven.modrinth，独占过滤会挡住 ForgeGradle 的映射仓库。
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // Mixin 0.8.5 官方 processor 分类器。缓存没有时正常下载，不用主 jar 拼类路径。
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // 玉（Jade 11.13.3+forge）。只进开发运行时，用来看怪物血量。不参与编译，也不写进 mods.toml。
    runtimeOnly fg.deobf("maven.modrinth:jade:11.13.3+forge")
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'xueximod.mixins.json'
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Mixin refmap 与 Shadow 成员增量。只登记任务，本段不执行构建。
// refmap 进独立目录再挂到 main output，不经过 processResources，避免和 compileJava、classes 互等。
def mixinRefmapRaw = layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json')
def mixinMemberTsrg = layout.buildDirectory.file('tmp/compileJava/compileJava-mappings.tsrg')
def mixinRefmapDirectory = layout.buildDirectory.dir('generated/mixin-refmap')
def mcpToSrg = tasks.named('createMcpToSrg', net.minecraftforge.gradle.mcp.tasks.GenerateSRG)
def srgToMcp = tasks.named('createSrgToMcp', net.minecraftforge.gradle.mcp.tasks.GenerateSRG)
def compileJavaTask = tasks.named('compileJava', JavaCompile)

compileJavaTask.configure {
    dependsOn mcpToSrg
    inputs.file(mcpToSrg.flatMap { generateTask -> generateTask.output }).withPropertyName('mcpToSrgForMixin')
    options.compilerArgs += [
            "-AreobfTsrgFile=${mcpToSrg.get().output.get().asFile.absolutePath}",
            "-AoutTsrgFile=${mixinMemberTsrg.get().asFile.absolutePath}",
            "-AoutRefMapFile=${mixinRefmapRaw.get().asFile.absolutePath}",
            '-AmappingTypes=tsrg'
    ]
    outputs.files(mixinRefmapRaw, mixinMemberTsrg)
    doFirst {
        def refmapFile = mixinRefmapRaw.get().asFile
        def memberFile = mixinMemberTsrg.get().asFile
        [refmapFile.parentFile, memberFile.parentFile].unique().each { parentDirectory ->
            if (!parentDirectory.isDirectory() && !parentDirectory.mkdirs()) {
                throw new GradleException("Could not create Mixin output directory: ${parentDirectory}")
            }
        }
        [refmapFile, memberFile].each { outputFile ->
            if (outputFile.exists() && !outputFile.delete()) {
                throw new GradleException("Could not clear Mixin processor output: ${outputFile}")
            }
        }
    }
    doLast {
        def refmapFile = mixinRefmapRaw.get().asFile
        def memberFile = mixinMemberTsrg.get().asFile
        if (!refmapFile.isFile() || refmapFile.length() == 0L) {
            throw new GradleException("Mixin refmap was not written: ${refmapFile}")
        }
        if (!memberFile.isFile() || memberFile.length() == 0L) {
            throw new GradleException("Mixin member mapping was not written: ${memberFile}")
        }
        def parsedRefmap
        try {
            parsedRefmap = new groovy.json.JsonSlurper().parse(refmapFile)
        } catch (Exception parseFailure) {
            throw new GradleException("Mixin refmap is not legal JSON: ${refmapFile}", parseFailure)
        }
        if (!(parsedRefmap instanceof Map) || parsedRefmap.isEmpty()) {
            throw new GradleException("Mixin refmap must be a non-empty JSON object: ${refmapFile}")
        }
        def officialMappings = parsedRefmap.get('mappings')
        def dataNode = parsedRefmap.get('data')
        def seargeMappings = dataNode instanceof Map ? dataNode.get('searge') : null
        if (!(officialMappings instanceof Map) || officialMappings.isEmpty()) {
            throw new GradleException("Mixin refmap mappings is missing or empty: ${refmapFile}")
        }
        if (!(seargeMappings instanceof Map) || seargeMappings.isEmpty()) {
            throw new GradleException("Mixin refmap data.searge is missing or empty: ${refmapFile}")
        }
        def memberLine = memberFile.readLines('UTF-8').find { line ->
            def trimmedLine = line.trim()
            if (trimmedLine.isEmpty() || trimmedLine.startsWith('#') || trimmedLine.startsWith('tsrg2') || trimmedLine.startsWith('MD:') || trimmedLine.startsWith('FD:') || trimmedLine.startsWith('CL:')) {
                return false
            }
            def columns = trimmedLine.split(/\s+/)
            return columns.length == 3 || columns.length == 4
        }
        if (memberLine == null) {
            throw new GradleException("Mixin member mapping has no slim field or method line: ${memberFile}")
        }
    }
}

def memberMappingProvider = compileJavaTask.map { compiledJava ->
    compiledJava.project.file(mixinMemberTsrg.get().asFile)
}
// 配置回调。reobfJar 由 ForgeGradle 晚注册，不用 tasks.named 提前取。
// 不在执行阶段改 inputs。不改 getMappings()，不送 refmap，不送 extractSrg。
tasks.withType(net.minecraftforge.gradle.userdev.tasks.RenameJarInPlace).configureEach {
    if (name == 'reobfJar') {
        dependsOn compileJavaTask
        extraMappings.from(memberMappingProvider)
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def jarTask = tasks.findByName('jar')
    def reobfTask = tasks.findByName('reobfJar')
    def requestsPublishChain = (jarTask != null && taskGraph.hasTask(jarTask)) || (reobfTask != null && taskGraph.hasTask(reobfTask))
    if (!requestsPublishChain) {
        return
    }
    if (reobfTask == null || reobfTask.path != ':reobfJar') {
        throw new GradleException('jar/reobf publish chain is missing :reobfJar')
    }
    if (!(reobfTask instanceof net.minecraftforge.gradle.userdev.tasks.RenameJarInPlace)) {
        throw new GradleException(":reobfJar type is ${reobfTask.getClass().name}, expected RenameJarInPlace")
    }
    def expectedMemberPath = mixinMemberTsrg.get().asFile.absolutePath
    def separatorNormalized = { String rawPath -> rawPath.replace('\\', '/') }
    def mappedPaths = reobfTask.extraMappings.files.collect { mappedFile -> mappedFile.absolutePath }
    def foundExpectedPath = mappedPaths.any { mappedPath ->
        separatorNormalized(mappedPath) == separatorNormalized(expectedMemberPath)
    }
    if (!foundExpectedPath) {
        throw new GradleException(":reobfJar extraMappings missing ${expectedMemberPath}; found ${mappedPaths}")
    }
}

def copyMixinRefmap = tasks.register('copyMixinRefmap', Copy) {
    group = 'build'
    description = 'Copy the Mixin refmap onto the main output as xueximod.refmap.json.'
    dependsOn compileJavaTask
    from(mixinRefmapRaw)
    into(mixinRefmapDirectory)
    rename { 'xueximod.refmap.json' }
}
sourceSets.main.output.dir(mixinRefmapDirectory, builtBy: copyMixinRefmap)

tasks.named('jar', Jar).configure {
    dependsOn copyMixinRefmap
    doLast {
        def archive = archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def refmapHits = []
            zip.entries().each { zipEntry ->
                def entryPath = zipEntry.name.replace('\\', '/')
                if (entryPath == 'xueximod.refmap.json' || entryPath.endsWith('/xueximod.refmap.json')) {
                    refmapHits.add(entryPath)
                }
            }
            if (refmapHits != ['xueximod.refmap.json']) {
                throw new GradleException("Expected exactly one root xueximod.refmap.json in ${archive.name}, found: ${refmapHits}")
            }
        } finally {
            zip.close()
        }
    }
}

minecraft.runs.configureEach { runConfig ->
    property 'mixin.env.remapRefMap', 'true'
    property 'mixin.env.refMapRemappingFile', srgToMcp.get().output.get().asFile.absolutePath
    def runTaskName = runConfig.taskName
    tasks.matching { candidate -> candidate.name == runTaskName }.configureEach {
        dependsOn srgToMcp
    }
}
def clientRunTaskName = minecraft.runs.getByName('client').taskName
tasks.matching { candidate -> candidate.name == clientRunTaskName }.configureEach {
    dependsOn copyMixinRefmap
}

tasks.register('nameGate', Exec) {
    group = 'verification'
    description = '检查局部变量和参数名'
    workingDir = rootProject.projectDir
    commandLine 'powershell', '-NoProfile', '-File', 'tools/check-name-gate.ps1'
}

// GPL-3.0-only 许可文件打进模组 jar。本任务只声明复制，本次移植不执行构建。
tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
        rename { 'LICENSE_GPL-3.0-only.txt' }
    }
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
        into 'META-INF'
    }
    from(rootProject.file('docs/LICENSE.txt')) {
        into 'META-INF'
        rename { 'LICENSE_FORGE_LGPL.txt' }
    }
    from(rootProject.file('docs/动作系统移植与扩展说明-2026-10-24.md')) {
        into 'META-INF'
    }
}

// 允许清单内的可构建源码包。排除版本库、Gradle 缓存、构建产物、游戏运行目录、令牌和后续 dev 授权资产。
// 本次只登记任务，不执行，因此还没有产出 zip，也没有用它验证过能够构建。
tasks.register('sourceDistributionZip', Zip) {
    group = 'distribution'
    description = 'Allowlisted GPL-3.0-only source archive. Excludes VCS, Gradle cache, build output, runs, tokens, and dev-authorized assets.'
    archiveFileName = "${mod_id}-${mod_version}-gpl-sources.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into("${mod_id}-${mod_version}-gpl-sources") {
        from(rootProject.file('src')) {
            into 'src'
            exclude '**/dev-authorized/**'
            exclude '**/.cache/**'
            exclude '**/*token*'
            exclude '**/*.env'
            exclude '**/credentials*'
            exclude '**/secrets*'
        }
        from(rootProject.file('gradle/wrapper')) {
            into 'gradle/wrapper'
        }
        from(rootProject.file('gradlew'))
        from(rootProject.file('gradlew.bat'))
        from(rootProject.file('build.gradle'))
        from(rootProject.file('settings.gradle'))
        from(rootProject.file('gradle.properties'))
        from(rootProject.file('LICENSE'))
        from(rootProject.file('THIRD_PARTY_NOTICES.md'))
        from(rootProject.file('tools/check-name-gate.ps1')) {
            into 'tools'
        }
        from(rootProject.file('tools/namegate')) {
            into 'tools/namegate'
        }
        from(rootProject.file('docs/LICENSE.txt')) {
            into 'docs'
        }
        from(rootProject.file('docs/动作系统移植与扩展说明-2026-10-24.md')) {
            into 'docs'
        }
        from(rootProject.file('docs/动作构建验证说明-2026-10-24.md')) {
            into 'docs'
        }
        from(rootProject.file('docs/动作渲染适配说明-2026-10-24.md')) {
            into 'docs'
        }
        from(rootProject.file('docs/水刃重设计与实现指导-2026-10-24.md')) {
            into 'docs'
        }
    }
    exclude '**/.git/**'
    exclude '**/.gradle/**'
    exclude '**/build/**'
    exclude '**/run/**'
    exclude '**/run-data/**'
}

// 扫描发行 jar 和源码 zip 的条目名。命中授权素材相对路径就失败，不只看顶层目录名。
tasks.register('verifyReleaseExcludesAuthorizedAssets') {
    group = 'verification'
    description = 'Fail when the jar or GPL source zip contains authorized Epic Fight asset entries.'
    dependsOn tasks.named('jar'), tasks.named('sourceDistributionZip')
    doLast {
        def archives = [
                tasks.named('jar', Jar).get().archiveFile.get().asFile,
                tasks.named('sourceDistributionZip', Zip).get().archiveFile.get().asFile
        ]
        def forbiddenTokens = new LinkedHashSet<String>()
        [
                'dev-authorized/',
                'assets/epicfight/',
                'animmodels/',
                'biped-armature.json',
                'import-manifest.json',
                'audited-whitelist.json',
                'entity/biped.json'
        ].each { forbiddenTokens.add(it) }
        def manifestFile = project.file('dev-authorized/epicfight/import-manifest.json')
        if (manifestFile.isFile()) {
            def parsed = new groovy.json.JsonSlurper().parse(manifestFile)
            parsed.files.each { record ->
                if (record.devRelativePath) {
                    forbiddenTokens.add(record.devRelativePath.toString())
                }
                if (record.sourceGitPath) {
                    forbiddenTokens.add(record.sourceGitPath.toString())
                }
            }
            if (parsed.skeletonExtractedRelativePath) {
                forbiddenTokens.add(parsed.skeletonExtractedRelativePath.toString())
            }
            if (parsed.skeletonSourceGitPath) {
                forbiddenTokens.add(parsed.skeletonSourceGitPath.toString())
            }
        }
        archives.each { archive ->
            def zip = new java.util.zip.ZipFile(archive)
            try {
                def hits = []
                zip.entries().each { entry ->
                    def entryName = entry.name.replace('\\', '/').toLowerCase(java.util.Locale.ROOT)
                    def matched = forbiddenTokens.find { token ->
                        def needle = token.toString().replace('\\', '/').toLowerCase(java.util.Locale.ROOT)
                        !needle.isEmpty() && (entryName.contains(needle) || entryName.endsWith(needle))
                    }
                    if (matched != null) {
                        hits.add(entry.name)
                    }
                }
                if (!hits.isEmpty()) {
                    throw new GradleException("Authorized asset entries in ${archive.name}: ${hits.join(', ')}")
                }
            } finally {
                zip.close()
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn 'verifyReleaseExcludesAuthorizedAssets'
}
